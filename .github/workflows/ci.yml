name: Organization controls CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: Trusted central policy and isolated verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Admit same-repository control changes
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          case "$ASSOCIATION" in
            OWNER|MEMBER) ;;
            *) test "$PR_AUTHOR" = 'dependabot[bot]'; test "$ACTOR" = 'dependabot[bot]' ;;
          esac
      - name: Check out approved controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: control
      - name: Check out candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Set up Node.js for approved controls
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Reject alternate candidate authority
        run: bash control/.github/scripts/reject-candidate-authorities.sh "$GITHUB_WORKSPACE/candidate"
      - name: Install pinned workflow linter
        run: bash control/.github/scripts/install-actionlint.sh
      - name: Validate candidate workflows as data
        shell: bash
        run: |
          shopt -s nullglob dotglob
          workflows=(candidate/.github/workflows/*.yml candidate/.github/workflows/*.yaml)
          test "${#workflows[@]}" -gt 0
          actionlint -shellcheck= -pyflakes= "${workflows[@]}"
      - name: Install trusted secret scanner
        run: bash control/.github/scripts/install-gitleaks.sh
      - name: Scan central history and candidate without repository configuration
        run: |
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner candidate
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner candidate
      - name: Execute candidate regressions only in isolation
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: node control/.github/scripts/run-repository-verify.mjs "$GITHUB_WORKSPACE/candidate"

  codeql:
    name: Trusted central CodeQL (${{ matrix.language }})
    needs: verify
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out approved controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Preserve approved validators outside the analysis tree
        id: trusted-controls
        run: |
          trusted_controls="$(mktemp -d "${RUNNER_TEMP:?}/central-codeql-controls.XXXXXX")"
          trusted_controls="$(cd "$trusted_controls" && pwd -P)"
          cp .github/scripts/reject-candidate-authorities.sh "$trusted_controls/"
          cp .github/scripts/check-codeql-sarif.mjs "$trusted_controls/"
          printf 'directory=%s\n' "$trusted_controls" >> "$GITHUB_OUTPUT"
      - name: Check out exact candidate source as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Reject alternate candidate authority
        env:
          TRUSTED_CONTROLS: ${{ steps.trusted-controls.outputs.directory }}
        run: bash "$TRUSTED_CONTROLS/reject-candidate-authorities.sh" "$GITHUB_WORKSPACE"
      - name: Initialize CodeQL without building candidate code
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Analyze invokes extractors from GITHUB_WORKSPACE, independently of source-root.
          source-root: ${{ github.workspace }}
      - name: Analyze the exact candidate with CodeQL
        id: codeql-analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          checkout_path: ${{ github.workspace }}
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fail closed on CodeQL findings
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          TRUSTED_CONTROLS: ${{ steps.trusted-controls.outputs.directory }}
        run: >-
          node "$TRUSTED_CONTROLS/check-codeql-sarif.mjs"
          '${{ steps.codeql-analyze.outputs.sarif-output }}'

  required:
    name: Organization controls verification
    if: ${{ always() }}
    needs: [verify, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require trusted admission, isolated verification and every CodeQL language
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$CODEQL_RESULT" = success
