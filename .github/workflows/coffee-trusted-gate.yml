name: OpenBoa Coffee trusted gate

on:
  workflow_call:
    inputs:
      control_sha:
        description: Immutable organization-controls revision selected by the trusted target wrapper
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    name: Trusted policy and secret boundary
    if: >-
      ${{ contains(fromJSON('["openboa-ai/coffee-chat",
      "openboa-ai/coffee-chat-roastery","openboa-ai/coffee-chat-eval",
      "openboa-ai/coffee-chat-bench"]'), github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sensitive: ${{ github.event_name == 'pull_request_target' && steps.classify.outputs.sensitive || 'false' }}
    steps:
      - name: Admit only the solo maintainer or in-repository Dependabot
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$BASE_REPOSITORY" in
            openboa-ai/coffee-chat|openboa-ai/coffee-chat-roastery|openboa-ai/coffee-chat-eval|openboa-ai/coffee-chat-bench) ;;
            *) exit 1 ;;
          esac
          if test "$EVENT_NAME" = push; then
            test "$REF_NAME" = refs/heads/main
            exit 0
          fi
          test "$EVENT_NAME" = pull_request_target
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              test "$ACTOR" = "$PR_AUTHOR"
              test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
              ;;
            *)
              test "$ACTOR" = 'dependabot[bot]'
              test "$PR_AUTHOR" = 'dependabot[bot]'
              test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
              ;;
          esac
      - name: Check out immutable organization controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: ${{ inputs.control_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control
      - name: Check out trusted target controls from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-target
      - name: Check out the exact candidate as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Reject alternate npm installation authority
        run: >-
          control/.github/scripts/reject-candidate-authorities.sh
          "$GITHUB_WORKSPACE/candidate"
      - name: Install immutable Gitleaks from organization controls
        run: bash control/.github/scripts/install-gitleaks.sh
      - name: Scan candidate history, worktree, and raw blobs without execution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          test ! -e candidate/.gitleaks.toml
          ignore_path=/dev/null
          history_ignore_path=/dev/null
          if test -e trusted-target/.gitleaksignore; then
            if test -e candidate/.gitleaksignore; then
              cmp trusted-target/.gitleaksignore candidate/.gitleaksignore
              ignore_path="$GITHUB_WORKSPACE/trusted-target/.gitleaksignore"
            fi
            history_ignore_path="$GITHUB_WORKSPACE/trusted-target/.gitleaksignore"
          else
            test ! -e candidate/.gitleaksignore
          fi
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path "$history_ignore_path" --ignore-gitleaks-allow \
            --redact --no-banner "$GITHUB_WORKSPACE/candidate"
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path "$ignore_path" --ignore-gitleaks-allow \
            --redact --no-banner "$GITHUB_WORKSPACE/candidate"
          if ! git -C candidate cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags --depth=1 \
              "https://github.com/$BASE_REPOSITORY.git" "$BASE_SHA"
          fi
          blob_dir="$(mktemp -d)"
          trap 'rm -rf "$blob_dir"' EXIT
          git -C candidate rev-list --objects "$BASE_SHA..$HEAD_SHA" |
            cut -d' ' -f1 |
            git -C candidate cat-file --batch-check='%(objectname) %(objecttype)' |
            awk '$2 == "blob" { print $1 }' |
            while read -r object_id; do
              git -C candidate cat-file blob "$object_id" > "$blob_dir/$object_id"
            done
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path "$ignore_path" --ignore-gitleaks-allow \
            --redact --no-banner "$blob_dir"
      - name: Set up Node.js for trusted controls
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Check central security policy against candidate data
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: >-
          node control/.github/scripts/check-candidate-policy.mjs
          "$GITHUB_WORKSPACE/trusted-target" "$GITHUB_WORKSPACE/candidate"
      - name: Classify policy evolution and protected path changes
        id: classify
        env:
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted-target
        run: node control/.github/scripts/classify-candidate.mjs

  sensitive-review:
    name: Sensitive change confirmation
    needs: authorize
    if: ${{ needs.authorize.outputs.sensitive == 'true' }}
    environment: coffee-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the GitHub Environment approval
        run: test '${{ needs.authorize.outputs.sensitive }}' = true

  dependency-review:
    name: Trusted dependency review
    if: >-
      ${{ contains(fromJSON('["openboa-ai/coffee-chat",
      "openboa-ai/coffee-chat-roastery","openboa-ai/coffee-chat-eval",
      "openboa-ai/coffee-chat-bench"]'), github.repository) }}
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject vulnerable dependency changes
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: never
          fail-on-severity: moderate
          fail-on-scopes: runtime,development,unknown
          show-patched-versions: true
      - name: Record post-merge dependency coverage
        if: ${{ github.event_name == 'push' }}
        run: echo 'The isolated quality lane audits the complete locked dependency graph on main.'

  codeql:
    name: Trusted CodeQL JavaScript-TypeScript
    if: >-
      ${{ contains(fromJSON('["openboa-ai/coffee-chat",
      "openboa-ai/coffee-chat-roastery","openboa-ai/coffee-chat-eval",
      "openboa-ai/coffee-chat-bench"]'), github.repository) }}
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out immutable organization controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: ${{ inputs.control_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control
      - name: Check out candidate source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: candidate
      - name: Initialize CodeQL without building candidate code
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: candidate
      - name: Analyze candidate data with CodeQL
        id: codeql-analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          checkout_path: ${{ github.workspace }}/candidate
          output: ${{ runner.temp }}/codeql-sarif
      - name: Fail closed on CodeQL findings
        run: >-
          node control/.github/scripts/check-codeql-sarif.mjs
          '${{ steps.codeql-analyze.outputs.sarif-output }}'

  quality:
    name: Isolated repository verification
    needs:
      - authorize
      - dependency-review
      - sensitive-review
    if: >-
      ${{ always() && needs.authorize.result == 'success' &&
      needs.dependency-review.result == 'success' &&
      (needs.authorize.outputs.sensitive != 'true' ||
      needs.sensitive-review.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out immutable organization controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: ${{ inputs.control_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control
      - name: Check out the exact authorized candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Run repository-owned verification in isolation
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: node control/.github/scripts/run-repository-verify.mjs "$GITHUB_WORKSPACE/candidate"

  required:
    name: OpenBoa Coffee trusted required
    if: >-
      ${{ always() && contains(fromJSON('["openboa-ai/coffee-chat",
      "openboa-ai/coffee-chat-roastery","openboa-ai/coffee-chat-eval",
      "openboa-ai/coffee-chat-bench"]'), github.repository) }}
    needs:
      - authorize
      - sensitive-review
      - dependency-review
      - codeql
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out immutable organization controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: ${{ inputs.control_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control
      - name: Require every trusted lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: node control/.github/scripts/check-required-results.mjs
